[package]
name = "msingi_accounting"
version = "0.13.5"
description = "Offline-first small business accounting"
authors = ["GTN Global Network"]
publish = false
edition = "2021"

[lib]
name = "msingi_accounting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
